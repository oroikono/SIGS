[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigs"
version = "0.1.0"
description = "Neuro-Symbolic AI for Analytical Solutions of Differential Equations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Orestis Oikonomou" },
  { name = "Levi Lingsch" },
  { name = "Dana Grund" },
  { name = "Siddhartha Mishra" },
  { name = "Georgios Kissas" },
]
keywords = [
  "neuro-symbolic AI",
  "symbolic regression",
  "partial differential equations",
  "analytical solutions",
  "closed-form solutions",
  "grammar VAE",
  "scientific machine learning",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23.0,<2.0",
  "sympy>=1.12",
  "symengine>=0.11.0",
  "torch>=2.0.0",
  "nltk>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
search = [
  "scipy>=1.10.0",
  "scikit-learn>=1.2.0",
  "cma>=3.2.0",
  "h5py>=3.8.0",
  "timeout-decorator>=0.5.0",
  "tqdm>=4.65.0",
]
train = [
  "lightning>=2.0.0",
  "h5py>=3.8.0",
]
optimize = [
  "jax>=0.4.20",
  "jaxlib>=0.4.20",
  "optax>=0.1.7",
]
huggingface = [
  "transformers>=4.45.0,<6",
  "huggingface-hub>=0.25.0",
  "safetensors>=0.4.5",
  "datasets>=3.0.0,<5",
  "accelerate>=1.0.0,<2",
  "h5py>=3.8.0",
]
plot = [
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
]
dev = [
  "build>=1.2.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "transformers>=4.45.0,<6",
  "huggingface-hub>=0.25.0",
  "safetensors>=0.4.5",
  "datasets>=3.0.0,<5",
  "accelerate>=1.0.0,<2",
  "h5py>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/oroikono/SIGS"
Paper = "https://arxiv.org/abs/2502.01476"
Video = "https://www.youtube.com/watch?v=a9MMvKVGhuQ"

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
