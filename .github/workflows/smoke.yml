name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint maintained library surfaces
        run: |
          ruff check \
            src/sigs/__init__.py \
            src/sigs/decoder.py \
            src/sigs/encoder.py \
            src/sigs/hf_data.py \
            src/sigs/huggingface.py \
            src/sigs/model.py \
            tests \
            examples/export_dataset_to_huggingface.py \
            examples/export_to_huggingface.py \
            examples/train_with_accelerate.py
          ruff format --check \
            src/sigs/__init__.py \
            src/sigs/decoder.py \
            src/sigs/encoder.py \
            src/sigs/hf_data.py \
            src/sigs/huggingface.py \
            src/sigs/model.py \
            tests \
            examples/export_dataset_to_huggingface.py \
            examples/export_to_huggingface.py \
            examples/train_with_accelerate.py
      - run: python scripts/smoke_test.py
      - run: pytest -q
      - run: python -m build --wheel
